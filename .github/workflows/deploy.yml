name: Savisor CI/CD Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read  # Required to check out repository code

jobs:
  build-and-deploy:
    name: Build Packages & Trigger Rolling Update
    runs-on: ubuntu-latest

    steps:
      # ==============================================================================
      # 1. Checkout & Build Environment Setup
      # ==============================================================================
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      # ==============================================================================
      # 2. Package Python Packages into Wheel Distributions (.whl)
      # ==============================================================================
      - name: Compile Wheel Packages
        run: |
          mkdir -p dist/
          # Build packages using uv build
          uv build --wheel --package shared-schemas --outdir dist/
          uv build --wheel --package session-wrapper --outdir dist/
          uv build --wheel --package orchestrator --outdir dist/

      # ==============================================================================
      # 3. Publish Wheels and Trigger Cloud-Agnostic Upgrade API
      # ==============================================================================
      - name: Publish Upgraded Wheels and Trigger Self-Update via API
        run: |
          # Verify we have wheels to upload
          WHEELS=$(ls dist/*.whl)
          if [ -z "$WHEELS" ]; then
            echo "ERROR: No built python wheel files found."
            exit 1
          fi
          
          echo "Found packages to deploy:"
          echo "$WHEELS"
          
          # Construct curl multipart upload arguments dynamically
          CURL_ARGS=()
          for wheel in $WHEELS; do
            CURL_ARGS+=("-F" "files=@$wheel")
          done
          
          # Execute secure POST request to the self-update API endpoint
          API_URL="${{ secrets.SAVISOR_API_URL }}"
          ADMIN_KEY="${{ secrets.SAVISOR_ADMIN_API_KEY }}"
          
          if [ -z "$API_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "ERROR: SAVISOR_API_URL and SAVISOR_ADMIN_API_KEY secrets must be configured in GitHub."
            exit 1
          fi
          
          echo "Triggering secure cloud-agnostic rolling update on host at $API_URL/upgrade..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $ADMIN_KEY" \
            "${CURL_ARGS[@]}" \
            "$API_URL/upgrade")
            
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | grep "HTTP_STATUS:" | cut -d':' -f2)
          
          echo "Server Response Body: $BODY"
          echo "HTTP Status Code: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "ERROR: Self-update deployment failed with status code $STATUS."
            exit 1
          fi
          
          echo "SUCCESS: Wheels successfully uploaded and self-update script successfully detached on host!"
