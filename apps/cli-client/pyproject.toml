[project]
name = "cli-client"
version = "0.1.0"
description = "Savisor MetaTrader 5 Central Orchestrator & Gateway CLI client"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "shared-schemas"
]

[project.scripts]
savisor-mt = "cli_client.main:app"

[tool.uv.sources]
shared-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
