[project]
name = "orchestrator"
version = "0.1.0"
description = "Central Orchestrator, Gateway Proxy, & Provisioning Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "shared-schemas",
    "python-multipart",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0"
]

[tool.uv.sources]
shared-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
