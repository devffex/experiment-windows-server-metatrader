[project]
name = "orchestrator"
version = "0.1.0"
description = "Central Orchestrator, Gateway Proxy, & Provisioning Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "shared-schemas"
]

[tool.uv.sources]
shared-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
