[project]
name = "session-wrapper"
version = "0.1.0"
description = "Session-Isolated MetaTrader 5 API loopback wrapper"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "psutil>=7.0.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "shared-schemas"
]

[tool.uv.sources]
shared-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
